      <stop stop-color="#111c42"/>
      <stop offset="0.55" stop-color="#172354"/>
      <stop offset="1" stop-color="#28204b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72a7ff"/>
      <stop offset="0.62" stop-color="#8fa7ff"/>
      <stop offset="1" stop-color="#b9a0ff"/>
    </linearGradient>
    <linearGradient id="card" x1="858" y1="65" x2="1110" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243b70"/>
      <stop offset="1" stop-color="#252650"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <path d="M24 0H1176Q1200 0 1200 24V6H0V24Q0 0 24 0Z" fill="url(#accent)"/>
