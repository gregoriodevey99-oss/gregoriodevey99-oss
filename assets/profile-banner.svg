<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Gregorio Devey · Mi camino en programación</title>
  <desc id="desc">Banner personal de Gregorio Devey, estudiante de programación. Desarrollo web y aplicaciones. Fondo azul y violeta, iniciales GD y detalles de código.</desc>
  <defs>
