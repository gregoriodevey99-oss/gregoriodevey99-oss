    <text x="54" y="148" fill="#ffffff" font-size="65" font-weight="700" letter-spacing="-2">Gregorio Devey</text>
    <text x="58" y="196" fill="#e0e7ff" font-size="25">Estudiante de programación</text>
    <text x="58" y="232" fill="#c4d0ee" font-size="24">Desarrollo web y aplicaciones</text>
    <rect x="58" y="273" width="370" height="39" rx="19.5" fill="#243a6b" stroke="#6b8cd1" stroke-opacity="0.45"/>
    <text x="80" y="298" fill="#edf3ff" font-size="17">Aprender. Construir. Seguir mejorando.</text>
    <g>
